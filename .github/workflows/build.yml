name: Build MLBB ESP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + ldid + SDK
        run: |
          brew install ldid
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Fix line endings
        run: |
          brew install dos2unix
          dos2unix control
          dos2unix Makefile
          dos2unix MLBBESP.plist

      - name: Build
        run: make package FINAL=YES

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-esp-deb
          path: packages/*.deb

      - name: Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-esp-dylib
          path: .theos/*/obj/debug/MLBBESP.dylib
